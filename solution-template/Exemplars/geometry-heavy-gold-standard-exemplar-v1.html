<style>
:root{

*{ box-sizing:border-box; }

body{

#app{ width:100%; }

.page{

    min-height:297mm;

    background:white;
    padding:20mm;

.header{

.school-block h1{

}

.school-block h2{

}

.meta{

    font-size:12px;
    line-height:1.5;
}

.question-section{
    margin-bottom:34px;
    break-inside:avoid;
}

.question-title{
    font-size:22px;
    font-weight:700;
    margin-bottom:10px;

}

    line-height:1.45;
    margin-bottom:10px;
    background:#f8f8f8;
    border-left:4px solid #999;
    padding:8px 12px;
}

.criteria-table{
    width:100%;

}

.criteria-table th{

    background:#f1f1f1;
    padding:6px 8px;
    font-size:14px;
    text-align:left;
}

.criteria-table td{

    padding:6px 8px;
    font-size:13px;

}

.criteria-table .marks{

    text-align:center;
    font-weight:bold;
}

.sample-answer-title{

    font-style:italic;

.solution-intro{

.solution-step{ margin-bottom:5px; }

.final-answer{

.step-reason{

.missing-engine{

.algebra-title {

.algebra-steps {

    padding: 2px 0;

.algebra-line-number {

.compact-note{
