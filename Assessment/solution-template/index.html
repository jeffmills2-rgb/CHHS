<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<title>CHHS Worked Solution Template</title>

<style>
:root{
    --border:#444;
    --light:#f5f5f5;
    --heading:#111;
    --text:#222;
    --accent:#0b57d0;
}

*{ box-sizing:border-box; }

body{
    margin:0;
    padding:40px;
    background:#dfe6ec;
    font-family:Arial, Helvetica, sans-serif;
    color:var(--text);
}

#app{
    width:100%;
}

.page{
    width:210mm;
    min-height:297mm;
    margin:auto;
    background:white;
    padding:22mm;
    box-shadow:0 0 18px rgba(0,0,0,0.15);
}

.header{
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    border-bottom:3px solid #222;
    padding-bottom:14px;
    margin-bottom:28px;
}

.school-block h1{
    margin:0;
    font-size:34px;
    letter-spacing:1px;
    color:var(--accent);
}

.school-block h2{
    margin:6px 0 0 0;
    font-size:18px;
    font-weight:500;
}

.meta{
    text-align:right;
    font-size:14px;
    line-height:1.6;
}

.question-section{
    margin-bottom:55px;
    break-inside:avoid;
}

.question-title{
    font-size:30px;
    font-weight:700;
    margin-bottom:18px;
    color:var(--heading);
}

.question-text{
    font-size:17px;
    line-height:1.6;
    margin-bottom:18px;
    background:#f8f8f8;
    border-left:5px solid #999;
    padding:12px 16px;
}

.criteria-table{
    width:100%;
    border-collapse:collapse;
    margin-bottom:24px;
}

.criteria-table th{
    border:2px solid var(--border);
    background:#f1f1f1;
    padding:11px;
    font-size:18px;
    text-align:left;
}

.criteria-table td{
    border:2px solid var(--border);
    padding:11px;
    font-size:17px;
    vertical-align:top;
}

.criteria-table .marks{
    width:100px;
    text-align:center;
    font-weight:bold;
}

.sample-answer-title{
    font-size:20px;
    font-style:italic;
    font-weight:700;
    margin-bottom:16px;
}

.solution-intro{
    font-size:16px;
    line-height:1.6;
    margin-bottom:14px;
}

.solution-box{
    padding-left:10px;
    font-size:22px;
    line-height:1.9;
    font-family:"Cambria Math","STIX Two Math","Times New Roman",serif;
}

.solution-step{
    margin-bottom:8px;
}

.final-answer{
    margin-top:18px;
    font-weight:bold;
}

.short-final-answer{
    font-family:"Cambria Math","STIX Two Math","Times New Roman",serif;
    font-size:26px;
    font-weight:bold;
    margin-top:18px;
}

.step-reason{
    font-family:Arial, Helvetica, sans-serif;
    font-size:14px;
    color:#555;
    margin-left:18px;
}

.diagram-box{
    width:100%;
    min-height:260px;
    margin-top:22px;
    border:1.5px solid #bbb;
    background:#fff;
    padding:10px;
    display:flex;
    align-items:center;
    justify-content:center;
}

.diagram-box.large{
    min-height:360px;
}

.teacher-note{
    margin-top:22px;
    background:#f8f8f8;
    border-left:5px solid #999;
    padding:13px 16px;
    font-size:15px;
    line-height:1.7;
}

.teacher-note ul{
    margin:8px 0 0 20px;
    padding:0;
}

.missing-engine{
    color:#900;
    font-weight:bold;
    font-size:16px;
}

/* Algebra Layout Engine */

.algebra-layout{
    width:100%;
    border:2px solid #222;
    background:#fff;
    padding:22px 26px;
    margin-top:18px;
}

.algebra-title{
    font-size:20px;
    font-weight:700;
    margin-bottom:18px;
    font-family:Arial, Helvetica, sans-serif;
}

.algebra-steps{
    display:grid;
    gap:8px;
}

.algebra-row{
    display:grid;
    grid-template-columns:38px 1fr 220px;
    column-gap:16px;
    align-items:start;
    padding:6px 0;
    border-bottom:1px solid #e5e5e5;
}

.algebra-line-number{
    font-size:14px;
    color:#666;
    font-family:Arial, Helvetica, sans-serif;
    padding-top:5px;
}

.algebra-expression{
    font-family:"Cambria Math","STIX Two Math","Times New Roman",serif;
    font-size:24px;
    line-height:1.6;
}

.algebra-reason{
    font-family:Arial, Helvetica, sans-serif;
    font-size:14px;
    color:#444;
    line-height:1.5;
    padding-top:8px;
}

.algebra-final{
    margin-top:18px;
    padding-top:12px;
    border-top:2px solid #222;
    font-family:"Cambria Math","STIX Two Math","Times New Roman",serif;
    font-size:26px;
    font-weight:700;
}

.algebra-notes{
    margin-top:18px;
    background:#f7f7f7;
    border-left:5px solid #777;
    padding:12px 16px;
    font-family:Arial, Helvetica, sans-serif;
    font-size:14px;
    line-height:1.6;
}

.algebra-note{
    margin-bottom:4px;
}

.footer{
    margin-top:60px;
    border-top:2px solid #222;
    padding-top:10px;
    font-size:13px;
    display:flex;
    justify-content:space-between;
    color:#666;
}

.page-break{
    break-before:page;
}

@media print{
    body{
        background:white;
        padding:0;
    }

    .page{
        width:100%;
        min-height:auto;
        box-shadow:none;
        margin:0;
        padding:16mm;
    }

    .question-section{
        break-inside:avoid;
    }
}
</style>
</head>

<body>

<div id="app"></div>

<script src="diagram-engines/algebra-layout.js"></script>
<script src="diagram-engines/coordinate-graph.js"></script>
<script src="diagram-engines/geometry-engine.js"></script>
<script src="diagram-engines/number-line.js"></script>
<script src="diagram-engines/integer-number-line-solution.js"></script>
<script src="diagram-engines/probability-tree.js"></script>

<script src="renderers/render-worked-solution.js"></script>

<script src="solution-data.js"></script>

</body>
</html>
